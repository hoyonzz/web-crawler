# crawler.yml
name: Job Crawler Pipeline

on:
  schedule:
    # 매일 UTC 기준 23시에 실행 (한국 시간 새벽 8시)
    - cron: '13 8 * * 1,3,5'
  
  # 수동 실행 버튼
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Docker Image 빌드
        run: docker build -t job-crawler .

      - name: 3. 컨테이너 실행 및 파이프라인 가동
        run: |
          docker run --rm \
          --shm-size=2gb \
          -v ${{ github.workspace }}/output:/app/output \
          -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
          -e NOTION_API_KEY="${{ secrets.NOTION_API_KEY }}" \
          -e NOTION_DATABASE_ID="${{ secrets.NOTION_DATABASE_ID }}" \
          job-crawler python main.py
      - name: 3.5. output 폴더 아티팩트 업로드 준비
        if: always()
        run: sudo chown -R $USER:$USER output/
          
      - name: 4. 실행 로그 및 에러 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output
          path: output/
