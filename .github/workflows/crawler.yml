# crawler.yml
name: Job Crawler Pipeline

on:
  # schedule:
  #   # 매일 UTC 기준 23시에 실행 (한국 시간 새벽 8시)
  #   - cron: '0 23 * * *'
  
  # 수동 실행 버튼
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Docker Image 빌드
        run: docker build -t job-crawler .
      
      - name: 2.5. 크로미옴 단독 기동 검증
        run: |
          docker run --rm job-crawler chromium --headless --no-sandbox \
            --disable-dev-shm-usage --dump-dom about:blank | head -20

      - name: 3. 컨테이너 실행 및 파이프라인 가동
        run: |
          docker run --rm \
          --shm-size=2gb \
          -v ${{ github.workspace }}/output:/app/output \
          -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
          -e NOTION_API_KEY="${{ secrets.NOTION_API_KEY }}" \
          -e NOTION_DATABASE_ID="${{ secrets.NOTION_DATABASE_ID }}" \
          job-crawler python main.py
      - name: 3.5. output 폴더 소유권 변경 및 로그 출력
        if: always()
        run: |
          # 1. 루트가 만든 파일들의 소유권을 현재 깃허브 유저로 강제 변경
          sudo chown -R $USER:$USER output/

          # 2. 크롬 드라이버 에러 로그를 깃허브 액션 화면에 바로 출력
          echo "=== 🚨 ChromeDriver 유언장 (Log) 🚨 ==="
          cat output/chromedriver.log || echo "로그 파일이 없습니다."
          
      - name: 4. 실행 로그 및 에러 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output
          path: output/
